# Bulk inference / published products catalog.
# Canonical public copies live on Source Cooperative; this file is the in-repo
# pointer so we do not check multi-GB GeoJSON/COG artifacts into git.
#
# Browse (web UI — use for folders/prefixes):
#   https://source.coop/earthgenome/amazon-mining-watch
#   https://source.coop/earthgenome/amazon-mining-watch/<prefix>
# Direct file download / S3-compatible proxy (object keys only — no trailing slash):
#   https://data.source.coop/earthgenome/amazon-mining-watch/<path/to/file.ext>
# Example object:
#   https://data.source.coop/earthgenome/amazon-mining-watch/cumulative_detections/..._cumulative2018-2023.geojson
# path_map.source_coop values below are prefixes under the product root (not full URLs).

schema_version: 1
updated: 2026-07-24

license: CC-BY-4.0
contact: info@earthgenome.org

stores:
  source_coop:
    visibility: public
    product: https://source.coop/earthgenome/amazon-mining-watch
    browse_root: https://source.coop/earthgenome/amazon-mining-watch
    https_root: https://data.source.coop/earthgenome/amazon-mining-watch
    notes: >
      Browse folders on browse_root (source.coop). https_root is for individual
      object keys only; trailing slashes and bare prefixes return InvalidRequest
      on the data proxy. Prefer browse_root links in public docs.
    # Example object URL:
    #   {https_root}/cumulative_detections/..._cumulative2018-2023.geojson

  gcs:
    # Internal Earth Genome redundancy only — not a public distribution channel.
    visibility: internal
    root: gs://amw-dev/outputs
    notes: >
      Team-only mirror. Layout follows local model-output folder names under
      outputs/, not the source.coop public tree. Prefer source_coop URLs in
      public docs and notebooks.

  local:
    visibility: workspace
    # Paths relative to the mining-detector repo root (data/outputs/...).
    # Only older checked-in products (v0.X archive) still have local: entries.
    outputs_root: data/outputs

# ---------------------------------------------------------------------------
# Current production model (2026 recompute) — not stored in git
# ---------------------------------------------------------------------------
products:
  - id: amazon-aca-v4.10b-ensemble
    status: current
    model: 48px_v4.10b-18d-20g-21a-22bc-ensemble
    region: Amazon_ACA
    description: >
      CNN ensemble detections on ~480 m patches. Website cumulatives use the
      stringent dual-threshold postprocess; single-period folders also include
      a relaxed postprocess and raw (t>=0.4) outputs. Artifacts live on
      source.coop + gs://amw-dev only (not checked into this repo).
    params:
      raw_min_confidence: 0.4
      cumulative_postprocess:
        t_main: 0.55
        t_iso: 0.8
        k: 5
        D_km: 3
      single_year_postprocess:
        t_main: 0.43
        t_iso: 0.75
        k: 5
        D_km: 3
      andes_supplemental_confidence: 0.2
    periods:
      years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
      quarters: [Q125, Q225, Q325, Q425, Q126, Q226]
    filename_grammar:
      raw: >
        Amazon_ACA_{model}_0.40_{start}_{end}.geojson
      postprocessed: >
        Amazon_ACA_{model}_0.40_{start}_{end}_t{t_main}_d{k}_{D}km_t-iso{t_iso}.geojson
      cumulative: >
        Amazon_ACA_{model}_t{t_main}_d{k}_{D}km_t-iso{t_iso}_cumulative2018-{tag}.geojson
      cumulative_diff: >
        Amazon_ACA_{model}_t{t_main}_d{k}_{D}km_t-iso{t_iso}_cumulative2018-{tag}-diff.geojson
    path_map:
      # source_coop keys are under the public product root; gcs paths are under
      # gs://amw-dev/outputs/ (shown relative to stores.gcs.root).
      cumulative_detections:
        source_coop: cumulative_detections/
        gcs: 48px_v4.10b-18d-20g-21a-22bc-ensemble/cumulative_t0.55_d5_3km_t-iso0.8/
        notes: Website layers. Includes diffs/ (period-over-period growth).

      single_periods_raw:
        source_coop: single_periods/raw_detections/
        gcs: 48px_v4.10b-18d-20g-21a-22bc-ensemble/raw_detections/

      single_periods_raw_andes:
        source_coop: single_periods/raw_detections/andes_supplemental/
        gcs: 48px_v4.10b-18d-20g-21a-22bc-ensemble/raw_detections/andes_supplemental/

      single_periods_post_relaxed:
        source_coop: single_periods/postprocessed_t0.43_d5_3km_t-iso0.75/
        gcs: 48px_v4.10b-18d-20g-21a-22bc-ensemble/postprocessed_t0.43_d5_3km_t-iso0.75/

      single_periods_post_stringent:
        source_coop: single_periods/postprocessed_t0.55_d5_3km_t-iso0.8/
        gcs: 48px_v4.10b-18d-20g-21a-22bc-ensemble/postprocessed_t0.55_d5_3km_t-iso0.8/

      mining_scar_masks:
        source_coop: mining_scar_masks/
        gcs: 48px_v4.10b-18d-20g-21a-22bc-ensemble/mining_scar_masks/
        notes: >
          SAM2 COGs for area estimates. Yearly masks are named
          mining_mask_{start}_{end}_epsg4326.tif. Quarterly
          mining_mask_Q{n}{yy}_full.tif files are built from SAM2 masks on
          that quarter's incremental detections, then OR-merged with the prior
          full-year mask (and any intervening quarter incrementals) via
          core/sam2_combine_masks.py — quarterly mosaics have large cloud gaps,
          so a quarter-only mask would under-cover known scars. Example:
          Q226_full = 2025 year mask ∪ Q126 incremental ∪ Q226 incremental.

          Per-tile *-logits.tif companions are NOT interchangeable with the
          masks: they are stored before the Gaussian smoothing (and clamped to
          ±16 log-odds), so thresholding them directly does not reproduce the
          mask — measured IoU ~0.84. Replay the smoothing per tile first, via
          core/sam2_logits.mask_from_logits, and union-merge afterwards; never
          threshold a logits mosaic. See core/README.md and
          docs/design/persistence-planning.md.

  - id: amazon-basin-ssl4eo-archived
    status: archived
    model: 48px_v0.X-SSL4EO-MLPensemble
    region: amazon_basin
    description: >
      Experimental foundation-model ensemble published Jan 2026; superseded by
      v4.10b CNN ensemble. Kept for provenance; extensively hand-cleaned.
      Still present under data/outputs/ in this repo (legacy check-ins).
    path_map:
      cumulative:
        source_coop: archived/48px_v0.X-SSL4EO-MLPensemble/cumulative/
        gcs: 48px_v0.X-SSL4EO-MLPensemble/cumulative/
        local: 48px_v0.X-SSL4EO-MLPensemble/cumulative/

      raw_detections:
        source_coop: archived/48px_v0.X-SSL4EO-MLPensemble/raw_detections/
        gcs: 48px_v0.X-SSL4EO-MLPensemble/raw_detections/
        local: 48px_v0.X-SSL4EO-MLPensemble/
        notes: >
          Local yearly geojsons sit at the model root; source.coop and GCS nest
          them under raw_detections/.

      mining_scar_masks:
        source_coop: archived/48px_v0.X-SSL4EO-MLPensemble/mining_scar_masks/
        gcs: 48px_v0.X-SSL4EO-MLPensemble/mining_scar_masks/
        local: 48px_v0.X-SSL4EO-MLPensemble/
        notes: >
          Folder renamed on source.coop from sam2_mining_scar_raster_masks/ to
          mining_scar_masks/ for consistency. Local legacy files may still use
          older paths under data/outputs/sam2/ or the model tree.

# ---------------------------------------------------------------------------
# Accumulation rules (for regenerating cumulatives / interpreting tags)
# ---------------------------------------------------------------------------
cumulative_rules:
  notebook: core/cumulatives_and_diffs.ipynb
  year_end: union of Amazon postprocessed (t0.55) + Andes supplemental through year Y
  quarters_2025: through-2024 years + progressive 2025 quarters (exclude full-year 2025)
  quarters_2026: full years through 2025 + progressive 2026 quarters (no 2025 quarters)
  diffs: current cumulative minus previous tag; drop polygons ≤ 11 ha
